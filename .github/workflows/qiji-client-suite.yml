name: qiji client suite

# 客户端独立CI——qiji商业层(登录墙/计费/自定义Key/权限门)的回归闸
# 与联动CI(qiji-api-contract,打真实测试站)互补:本CI零网络,只验客户端代码自身
# 原料: 既有vitest测试文件(0.20.5aa带的四防测试全在此),冷跑~2分钟
# 触发: 手动 + push到fix/b1(仅当客户端目录有改动时跑,过滤路径)

on:
  workflow_dispatch:
  push:
    branches: [fix/b1-hermes-home-chain]
    paths:
      - 'apps/desktop/src/**'
      - 'apps/desktop/electron/**'
      - 'hermes_cli/auth.py'
      - 'hermes_cli/providers.py'
      - '.github/workflows/qiji-client-suite.yml'

concurrency:
  group: qiji-client-suite
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qiji-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps (workspace根,hoist到desktop可用)
        run: npm ci --no-audit --no-fund

      - name: Typecheck (4段全跑,electron/renderer/shared)
        working-directory: apps/desktop
        run: npm run typecheck

      - name: qiji商业核心测试(登录墙/计费/自定义Key/权限刷新)
        working-directory: apps/desktop
        run: npx vitest run --project ui
          src/store/auth-custom-key-refresh.test.ts
          src/store/billing-block.test.ts
          src/store/auth-custom-key-review-hardening.test.ts
          src/app/session/hooks/use-prompt-actions/submit-view-binding.test.ts

      - name: qiji i18n与供应商守门(汉化键对齐/池长度/国内清单断言)
        working-directory: apps/desktop
        run: npx vitest run --project ui
          src/i18n/catalog-completeness.test.ts
          src/app/settings/providers-settings.test.tsx
          src/app/settings/custom-endpoints-settings.test.tsx

      - name: 引擎供应商注册表健康(api-key型,含国内新增三家)
        run: python3 -m pytest tests/hermes_cli/test_api_key_providers.py -q

      - name: Summary
        if: always()
        run: |
          echo "## qiji 客户端独立套件" >> $GITHUB_STEP_SUMMARY
          echo "- typecheck 四段 + 商业核心4测试文件(9断言族)" >> $GITHUB_STEP_SUMMARY
          echo "- i18n守门(zh/en键+池长度对齐) + 供应商页断言(国内清单)" >> $GITHUB_STEP_SUMMARY
          echo "- 引擎供应商注册表(59项,含豆包/文心/硅基)" >> $GITHUB_STEP_SUMMARY
          echo "- 零网络:不打任何服务端,纯代码回归" >> $GITHUB_STEP_SUMMARY
          echo "- 联动闸见 qiji API contract(打测试站)" >> $GITHUB_STEP_SUMMARY
